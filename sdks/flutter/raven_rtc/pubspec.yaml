name: raven_rtc
description: >-
  Raven SDK for Flutter — join a room, publish camera and microphone, render
  participants. Hides WebRTC, SDP, ICE, STUN, TURN and the media server behind
  a small typed API.
version: 0.1.0
homepage: https://github.com/atulsinghhhh/Raven
repository: https://github.com/atulsinghhhh/Raven
issue_tracker: https://github.com/atulsinghhhh/Raven/issues
documentation: https://github.com/atulsinghhhh/Raven/blob/main/docs/sdk/flutter.md

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # The SFU client. Same role livekit-client plays in @raven/rtc on web:
  # it brings the native WebRTC implementation for iOS and Android, and it
  # is never re-exported from this package's public API.
  livekit_client: ^2.11.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Deliberately not declared as a plugin. raven_rtc ships no platform
# channels and no native code: the iOS and Android WebRTC implementation
# arrives through livekit_client (which wraps flutter_webrtc), exactly as
# @raven/rtc gets it from livekit-client on the web. A second native layer
# would mean two implementations competing for the same camera.
