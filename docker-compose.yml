
name: raven

networks:
  raven-network:
    name: raven-network
    driver: bridge

volumes:
  raven-redis-data:
    name: raven-redis-data
  raven-minio-data:
    name: raven-minio-data

services:
  redis:
    image: redis:7-alpine
    container_name: raven-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - raven-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - raven-network
  sfu:
    build:
      context: ./services/sfu
      dockerfile: Dockerfile
    image: raven/sfu:dev
    container_name: raven-sfu
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      SFU_NODE_ID: ${SFU_NODE_ID:-sfu-local-01}
      SFU_REGION: ${SFU_DEFAULT_REGION:-local}
      # What clients are told to reach for media. "localhost" works for a
      # browser on this machine; a real deployment needs a routable name.
      SFU_PUBLIC_HOST: ${SFU_PUBLIC_HOST:-localhost}
      # Advertised in ICE candidates. Without it every candidate carries
      # the container's private address, which no client can reach, and
      # the only connections that work are TURN relays.
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-127.0.0.1}
      SFU_HTTP_ADDR: ":7000"
      # Container-to-container by default, not host-facing: the api
      # container is on this network, so "localhost" would point back at
      # the SFU itself. Must track API_PORT. Hardcoded to :4000 previously,
      # which the api container has never listened on — registration failed
      # with "connection refused" on every retry, so no node ever reached
      # the registry and /health reported sfu: down. config.go's own default
      # is :4000 too; neither is the port this deployment uses.
      #
      # Overridable because the hot-reload workflow stops the api container
      # (docs/local-development.md) — and a stopped container takes its DNS
      # name with it, so this default then fails with "no such host", which
      # reads like a broken SFU rather than a missing peer. Set
      # SFU_CONTROL_PLANE_URL=http://host.docker.internal:4100 to reach an
      # API running on the host instead.
      SFU_CONTROL_PLANE_URL: ${SFU_CONTROL_PLANE_URL:-http://api:${API_PORT:-4100}}
      # What the node advertises to the control plane as its own reachable
      # address — the API's readiness probe fetches this, so it has to be
      # resolvable from wherever the API runs, not from here. Same override
      # story as SFU_CONTROL_PLANE_URL above: an API on the host needs
      # http://localhost:7000 (the published port), because "sfu" is a name
      # that only exists on this network.
      SFU_INTERNAL_URL: ${SFU_INTERNAL_URL:-http://sfu:7000}
      SFU_REGISTRATION_SECRET: ${SFU_REGISTRATION_SECRET:?SFU_REGISTRATION_SECRET is required}
      SFU_HEARTBEAT_INTERVAL_SECONDS: ${SFU_HEARTBEAT_INTERVAL_SECONDS:-10}
      SFU_ROOM_CAPACITY: ${SFU_ROOM_CAPACITY:-100}
      SFU_UDP_PORT_MIN: ${SFU_UDP_PORT_MIN:-51000}
      SFU_UDP_PORT_MAX: ${SFU_UDP_PORT_MAX:-51200}
      SFU_LOG_LEVEL: ${SFU_LOG_LEVEL:-info}
    ports:
      - "${SFU_HTTP_PORT:-7000}:7000"                # node link, health, metrics
      # Media. Published one-to-one because ICE advertises the exact port
      # it bound — a remapped range would hand clients addresses that do
      # not exist.
      - "${SFU_UDP_PORT_MIN:-51000}-${SFU_UDP_PORT_MAX:-51200}:51000-51200/udp"
    healthcheck:
      # Liveness, not readiness: a node whose control-plane link is down is
      # still serving the calls already on it, and restarting it would drop
      # them. /readyz is what the allocator cares about.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network

  # coturn — TURN/STUN relay for clients stuck behind restrictive NATs
  # or firewalls. See docs/architecture/turn.md.
  coturn:
    image: coturn/coturn:4.17.2
    container_name: raven-coturn
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}"
      - "--realm=${TURN_REALM:-raven.local}"
      # Quotas/bandwidth cap aren't secret, but they're still CLI flags
      # rather than turnserver.conf lines — that file can't expand ${VARS}.
      - "--user-quota=${TURN_USER_QUOTA:-10}"
      - "--total-quota=${TURN_TOTAL_QUOTA:-400}"
      - "--max-bps=${TURN_MAX_BPS:-1000000}"
      # Prometheus metrics endpoint.
      - "--prometheus"
      - "--prometheus-port=${TURN_PROMETHEUS_PORT:-9641}"
      # DTLS is opt-in even with a cert configured — TURNS (TLS over TCP)
      # alone doesn't switch it on too.
      - "--dtls"
      # coturn blocks relaying to loopback addresses by default (anti-SSRF).
      # Locally the SFU advertises SFU_PUBLIC_IP=127.0.0.1 so a browser on
      # the host can reach it directly, and that same 127.0.0.1 candidate
      # is what a forced-TURN-relay client has to relay *to* — hence this
      # flag. Real deployments should never need it, and must not set it.
      # See docs/turn.md#local-dev-only-flags.
      - "--allow-loopback-peers"
    volumes:
      - ./infrastructure/docker/coturn/turnserver.conf:/etc/turnserver.conf:ro
      # Self-signed local-dev cert (scripts/generate-turn-cert.sh). Gitignored, never committed.
      - ./infrastructure/docker/coturn/certs:/etc/coturn/certs:ro
    ports:
      - "${TURN_PORT:-3478}:3478/udp"                # STUN/TURN control, UDP
      - "${TURN_PORT:-3478}:3478/tcp"                # STUN/TURN control, TCP fallback
      - "${TURN_TLS_PORT:-5349}:5349/tcp"            # TURNS (TLS) control
      - "${TURN_TLS_PORT:-5349}:5349/udp"            # TURN/DTLS control
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:49160-49200/udp" # relayed media
      # Metrics port, handy for local dev — don't expose this in production.
      - "${TURN_PROMETHEUS_PORT:-9641}:9641/tcp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # minio — S3-compatible object storage for chat attachments. Files never
  # pass through the API or the WebSocket; clients PUT straight here using
  # a short-lived signed URL. Swap for S3/R2/Spaces in production — the
  # API only speaks SigV4, not anything MinIO-specific.
  # See docs/chat/attachments.md.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: raven-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-raven-minio-access}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    ports:
      - "${STORAGE_PORT:-9000}:9000"      # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"  # web console, local dev only
    volumes:
      - raven-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # Creates the attachments bucket once and exits. Keeps `pnpm infra:up`
  # a single command instead of "and then go click around in the console".
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: raven-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set raven http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-raven-minio-access} ${STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing raven/${STORAGE_BUCKET:-raven-attachments} &&
      echo 'bucket ready'
      "
    networks:
      - raven-network

  # Applies prisma/migrations/ to Supabase once, then exits — the local
  # stand-in for production's one-shot migration job. `api` waits on this
  # completing, so `pnpm infra:up` still needs no manual migrate step.
  #
  # Deliberately a separate service rather than part of api's CMD: the api
  # image is what production scales to N instances, and N of them migrating
  # concurrently through a transaction pooler is a lock contention bug (see
  # apps/api/Dockerfile's CMD comment). One migrator, then the app.
  #
  # Same image as api, different command — no extra build.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raven-migrate
    restart: "no"
    environment:
      # Session mode (:5432), not the :6543 pooler DATABASE_URL points at:
      # the schema engine needs one session it can hold an advisory lock on
      # across several statements. This is the only container that reads it.
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required to migrate — see .env.example}
      # prisma.config.ts falls back to DATABASE_URL when DIRECT_URL is
      # unset; passed through so that fallback resolves rather than throwing.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — see .env.example}
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks:
      - raven-network

  # api — the control plane. Handles auth, projects, api keys, rooms, RTC
  # tokens. Doesn't touch media itself. See docs/control-plane.md.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raven-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4100}
      # Passed straight through from .env, unlike REDIS_URL below: the
      # database is external (Supabase), so there is no container-internal
      # address to rewrite it to. Keep it on the :6543 transaction pooler.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — see .env.example}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # No DIRECT_URL here on purpose: the running app never reads it (only
      # the Prisma CLI does, via prisma.config.ts), and this container no
      # longer migrates — the `migrate` service above does that and holds
      # the only session-mode connection.
      # Container-to-container address, not the host-facing REDIS_URL from
      # .env (that one points at localhost + the mapped port, for
      # `pnpm start:dev` on the host).
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Signs Raven's own RTC tokens. Must differ from JWT_SECRET and
      # CHAT_TOKEN_SECRET — see docs/rtc/security.md.
      RTC_TOKEN_SECRET: ${RTC_TOKEN_SECRET:?RTC_TOKEN_SECRET is required}
      RTC_TOKEN_DEFAULT_TTL_SECONDS: ${RTC_TOKEN_DEFAULT_TTL_SECONDS:-600}
      # How SFU nodes authenticate to the control plane. Server-to-server
      # only; never handed to a client.
      SFU_REGISTRATION_SECRET: ${SFU_REGISTRATION_SECRET:?SFU_REGISTRATION_SECRET is required}
      SFU_HEARTBEAT_TIMEOUT_SECONDS: ${SFU_HEARTBEAT_TIMEOUT_SECONDS:-30}
      SFU_DEFAULT_REGION: ${SFU_DEFAULT_REGION:-local}
      # Host-facing: this is handed back to clients as `endpoint`, so it
      # cannot be the internal "api:4000" address. Derived from
      # API_PUBLIC_URL when unset.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      SIGNALING_MAX_PARTICIPANTS_PER_ROOM: ${SIGNALING_MAX_PARTICIPANTS_PER_ROOM:-50}
      SIGNALING_MAX_MESSAGE_BYTES: ${SIGNALING_MAX_MESSAGE_BYTES:-16384}
      SIGNALING_MAX_MESSAGES_PER_WINDOW: ${SIGNALING_MAX_MESSAGES_PER_WINDOW:-100}
      SIGNALING_MESSAGE_WINDOW_SECONDS: ${SIGNALING_MESSAGE_WINDOW_SECONDS:-10}
      SIGNALING_MAX_CONNECTIONS_PER_WINDOW: ${SIGNALING_MAX_CONNECTIONS_PER_WINDOW:-20}
      # Host-facing on purpose — this goes to real clients as an ICE
      # server address, so it cannot be the internal "coturn" name.
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      # Hardcoded to the Docker service name — only used by the api's own
      # /health STUN check, which runs inside this network.
      TURN_INTERNAL_HOST: coturn
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      # Chat (Phase 12). Its own signing key, never JWT_SECRET.
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:?CHAT_TOKEN_SECRET is required}
      CHAT_TOKEN_DEFAULT_TTL_SECONDS: ${CHAT_TOKEN_DEFAULT_TTL_SECONDS:-3600}
      CHAT_MAX_TEXT_LENGTH: ${CHAT_MAX_TEXT_LENGTH:-4000}
      CHAT_SEND_RATE_LIMIT: ${CHAT_SEND_RATE_LIMIT:-30}
      CHAT_PRESENCE_TTL_SECONDS: ${CHAT_PRESENCE_TTL_SECONDS:-45}
      CHAT_TYPING_TTL_SECONDS: ${CHAT_TYPING_TTL_SECONDS:-7}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-0}
      # Container-to-container address, same story as DATABASE_URL/REDIS_URL —
      # .env's STORAGE_ENDPOINT points at localhost for host-side runs.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raven-attachments}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-raven-minio-access}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_FORCE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-4100}:${API_PORT:-4100}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${API_PORT:-4100}/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network
