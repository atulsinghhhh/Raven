# Raven local dev stack: Postgres, Redis, LiveKit (SFU + signaling),
# coturn (TURN/STUN), and the api control plane.
#
# No separate "signaling" service here — LiveKit does that itself, so a
# standalone container would just be redundant. See docs/architecture/signaling.md.
#
# Usage:
#   cp .env.example .env   # then edit the generated secrets
#   pnpm infra:up
#
# Full instructions: docs/local-development.md

name: raven

networks:
  raven-network:
    name: raven-network
    driver: bridge

volumes:
  raven-postgres-data:
    name: raven-postgres-data
  raven-redis-data:
    name: raven-redis-data
  raven-minio-data:
    name: raven-minio-data

services:
  # Postgres — stores users, projects, api keys, rooms, usage records.
  # See infrastructure-decisions.md if you want the reasoning.
  postgres:
    image: postgres:16-alpine
    container_name: raven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - raven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # Creates the raven_community database on this same Postgres instance,
  # then exits. Separate logical database from `raven` above — Raven
  # Community (apps/community-api) owns its own schema and never touches
  # Raven's own tables. Idempotent so `pnpm infra:up` stays a single command
  # across restarts.
  community-db-init:
    image: postgres:16-alpine
    container_name: raven-community-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      psql -tc \"SELECT 1 FROM pg_database WHERE datname = 'raven_community'\" | grep -q 1 ||
      psql -c \"CREATE DATABASE raven_community\"
      "
    networks:
      - raven-network

  # Redis — ephemeral stuff: presence, rate limiting, room-state cache,
  # token bookkeeping, and LiveKit's own coordination store.
  redis:
    image: redis:7-alpine
    container_name: raven-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - raven-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - raven-network

  # LiveKit — our SFU + signaling (see sfu-comparison.md / signaling.md
  # for why). Needs Redis for internal coordination.
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: raven-livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: >
      --config /etc/livekit.yaml
      --keys "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      --redis-host redis:6379
      --redis-password ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --node-ip=${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./infrastructure/docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"                 # HTTP + WebSocket signaling
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"         # RTC media, TCP fallback
      - "${LIVEKIT_RTC_UDP_START:-50000}-${LIVEKIT_RTC_UDP_END:-50019}:50000-50019/udp" # RTC media (ICE/SRTP)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network

  # coturn — TURN/STUN relay for clients stuck behind restrictive NATs
  # or firewalls. See docs/architecture/turn.md.
  coturn:
    image: coturn/coturn:4.17.2
    container_name: raven-coturn
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}"
      - "--realm=${TURN_REALM:-raven.local}"
      # Quotas/bandwidth cap aren't secret, but they're still CLI flags
      # rather than turnserver.conf lines — that file can't expand ${VARS}.
      - "--user-quota=${TURN_USER_QUOTA:-10}"
      - "--total-quota=${TURN_TOTAL_QUOTA:-400}"
      - "--max-bps=${TURN_MAX_BPS:-1000000}"
      # Prometheus metrics endpoint.
      - "--prometheus"
      - "--prometheus-port=${TURN_PROMETHEUS_PORT:-9641}"
      # DTLS is opt-in even with a cert configured — TURNS (TLS over TCP)
      # alone doesn't switch it on too.
      - "--dtls"
      # coturn blocks relaying to loopback addresses by default (anti-SSRF).
      # LiveKit runs with --node-ip=127.0.0.1 so the host browser can reach
      # it directly, and that same 127.0.0.1 candidate is what a
      # forced-TURN-relay client has to relay *to* — so we need this flag
      # here. Real deployments should never need it. See docs/turn.md#local-dev-only-flags.
      - "--allow-loopback-peers"
    volumes:
      - ./infrastructure/docker/coturn/turnserver.conf:/etc/turnserver.conf:ro
      # Self-signed local-dev cert (scripts/generate-turn-cert.sh). Gitignored, never committed.
      - ./infrastructure/docker/coturn/certs:/etc/coturn/certs:ro
    ports:
      - "${TURN_PORT:-3478}:3478/udp"                # STUN/TURN control, UDP
      - "${TURN_PORT:-3478}:3478/tcp"                # STUN/TURN control, TCP fallback
      - "${TURN_TLS_PORT:-5349}:5349/tcp"            # TURNS (TLS) control
      - "${TURN_TLS_PORT:-5349}:5349/udp"            # TURN/DTLS control
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:49160-49200/udp" # relayed media
      # Metrics port, handy for local dev — don't expose this in production.
      - "${TURN_PROMETHEUS_PORT:-9641}:9641/tcp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # minio — S3-compatible object storage for chat attachments. Files never
  # pass through the API or the WebSocket; clients PUT straight here using
  # a short-lived signed URL. Swap for S3/R2/Spaces in production — the
  # API only speaks SigV4, not anything MinIO-specific.
  # See docs/chat/attachments.md.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: raven-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-raven-minio-access}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    ports:
      - "${STORAGE_PORT:-9000}:9000"      # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"  # web console, local dev only
    volumes:
      - raven-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # Creates the attachments bucket once and exits. Keeps `pnpm infra:up`
  # a single command instead of "and then go click around in the console".
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: raven-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set raven http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-raven-minio-access} ${STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing raven/${STORAGE_BUCKET:-raven-attachments} &&
      echo 'bucket ready'
      "
    networks:
      - raven-network

  # api — the control plane. Handles auth, projects, api keys, rooms, RTC
  # tokens. Doesn't touch media itself. See docs/control-plane.md.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raven-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4100}
      # These are container-to-container addresses, not the host-facing
      # DATABASE_URL/REDIS_URL from .env (those point at localhost + the
      # mapped ports, for Prisma CLI / `pnpm start:dev` on the host).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      # Host-facing on purpose — this gets handed back to browsers/mobile
      # clients so they know where to connect. Can't be the internal
      # "livekit:7880" address.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      # Hardcoded to the Docker service name, same as DATABASE_URL/REDIS_URL
      # above. Not pulled from .env's LIVEKIT_INTERNAL_URL, which defaults
      # to a host-reachable address for `pnpm start:dev`/e2e runs on the
      # host. This one's what the api process itself uses (RoomServiceClient,
      # /health) since it's on the same Docker network. See docs/dashboard.md#health.
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      RTC_TOKEN_DEFAULT_TTL_SECONDS: ${RTC_TOKEN_DEFAULT_TTL_SECONDS:-600}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      SIGNALING_MAX_PARTICIPANTS_PER_ROOM: ${SIGNALING_MAX_PARTICIPANTS_PER_ROOM:-50}
      SIGNALING_MAX_MESSAGE_BYTES: ${SIGNALING_MAX_MESSAGE_BYTES:-16384}
      SIGNALING_MAX_MESSAGES_PER_WINDOW: ${SIGNALING_MAX_MESSAGES_PER_WINDOW:-100}
      SIGNALING_MESSAGE_WINDOW_SECONDS: ${SIGNALING_MESSAGE_WINDOW_SECONDS:-10}
      SIGNALING_MAX_CONNECTIONS_PER_WINDOW: ${SIGNALING_MAX_CONNECTIONS_PER_WINDOW:-20}
      # Host-facing on purpose, same reasoning as LIVEKIT_URL — this goes
      # to real clients as an ICE server address.
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      # Hardcoded like LIVEKIT_INTERNAL_URL — only used by api's own
      # /health STUN check.
      TURN_INTERNAL_HOST: coturn
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      # Chat (Phase 12). Its own signing key, never JWT_SECRET.
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:?CHAT_TOKEN_SECRET is required}
      CHAT_TOKEN_DEFAULT_TTL_SECONDS: ${CHAT_TOKEN_DEFAULT_TTL_SECONDS:-3600}
      CHAT_MAX_TEXT_LENGTH: ${CHAT_MAX_TEXT_LENGTH:-4000}
      CHAT_SEND_RATE_LIMIT: ${CHAT_SEND_RATE_LIMIT:-30}
      CHAT_PRESENCE_TTL_SECONDS: ${CHAT_PRESENCE_TTL_SECONDS:-45}
      CHAT_TYPING_TTL_SECONDS: ${CHAT_TYPING_TTL_SECONDS:-7}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-0}
      # Container-to-container address, same story as DATABASE_URL/REDIS_URL —
      # .env's STORAGE_ENDPOINT points at localhost for host-side runs.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raven-attachments}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-raven-minio-access}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_FORCE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-4100}:${API_PORT:-4100}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${API_PORT:-4100}/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network
