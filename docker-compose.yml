# Raven — local development infrastructure.
#
# Brings up every piece of infrastructure decided in Phase 0
# (docs/architecture/infrastructure-decisions.md) plus the Phase 2
# control plane API:
#   PostgreSQL, Redis, LiveKit (SFU + signaling), coturn (TURN/STUN), api.
#
# Deliberately NOT included yet (see docs/architecture/signaling.md):
#   - A separate "signaling" service: LiveKit provides signaling itself,
#     so a standalone signaling container would be redundant.
#
# Usage:
#   cp .env.example .env   # then edit the generated secrets
#   pnpm infra:up
#
# See docs/local-development.md for full instructions.

name: raven

networks:
  raven-network:
    name: raven-network
    driver: bridge

volumes:
  raven-postgres-data:
    name: raven-postgres-data
  raven-redis-data:
    name: raven-redis-data

services:
  # ---------------------------------------------------------------------
  # PostgreSQL — system of record for users, projects, API keys, rooms
  # (metadata), usage records. See infrastructure-decisions.md.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: raven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - raven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # ---------------------------------------------------------------------
  # Redis — ephemeral state: presence, rate limiting, room-state cache,
  # short-lived token bookkeeping, and LiveKit's own coordination store.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: raven-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - raven-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - raven-network

  # ---------------------------------------------------------------------
  # LiveKit — SFU + signaling (Phase 0 decision, see sfu-comparison.md
  # and signaling.md). Depends on Redis for internal coordination.
  # ---------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: raven-livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: >
      --config /etc/livekit.yaml
      --keys "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      --redis-host redis:6379
      --redis-password ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --node-ip=${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./infrastructure/docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"                 # HTTP + WebSocket signaling
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"         # RTC media, TCP fallback
      - "${LIVEKIT_RTC_UDP_START:-50000}-${LIVEKIT_RTC_UDP_END:-50019}:50000-50019/udp" # RTC media (ICE/SRTP)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network

  # ---------------------------------------------------------------------
  # coturn — TURN/STUN relay for clients behind restrictive NATs/
  # firewalls. See docs/architecture/turn.md.
  # ---------------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.17.2
    container_name: raven-coturn
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}"
      - "--realm=${TURN_REALM:-raven.local}"
      # Per-user/global allocation quotas and bandwidth cap — non-secret,
      # but still CLI flags rather than turnserver.conf lines, since the
      # conf file has no ${VAR} expansion. See docs/turn.md#abuse-protection.
      - "--user-quota=${TURN_USER_QUOTA:-10}"
      - "--total-quota=${TURN_TOTAL_QUOTA:-400}"
      - "--max-bps=${TURN_MAX_BPS:-1000000}"
      # Prometheus metrics — see docs/turn.md#turn-usage-metrics.
      - "--prometheus"
      - "--prometheus-port=${TURN_PROMETHEUS_PORT:-9641}"
      # DTLS (TURN-over-UDP-with-TLS) is opt-in in coturn even when a
      # cert is configured — TURNS (TLS-over-TCP) alone does not imply it.
      - "--dtls"
      # Local-dev-only: coturn refuses by default to relay to loopback peer
      # addresses (anti-SSRF protection). LiveKit here is started with
      # --node-ip=127.0.0.1 so the host-machine browser can reach it
      # directly (Test A). That same 127.0.0.1 candidate is also what a
      # forced-TURN-relay client (Test B) must relay *to*, so the relay
      # peer restriction must be lifted in this compose file. Real
      # deployments never need this flag — see docs/turn.md#local-dev-only-flags.
      - "--allow-loopback-peers"
    volumes:
      - ./infrastructure/docker/coturn/turnserver.conf:/etc/turnserver.conf:ro
      # Self-signed, local-dev-only TLS cert — see scripts/generate-turn-cert.sh
      # and docs/turn.md#tls. Never committed (.gitignore).
      - ./infrastructure/docker/coturn/certs:/etc/coturn/certs:ro
    ports:
      - "${TURN_PORT:-3478}:3478/udp"                # STUN/TURN control, UDP
      - "${TURN_PORT:-3478}:3478/tcp"                # STUN/TURN control, TCP fallback
      - "${TURN_TLS_PORT:-5349}:5349/tcp"            # TURNS (TLS) control
      - "${TURN_TLS_PORT:-5349}:5349/udp"            # TURN/DTLS control
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:49160-49200/udp" # relayed media
      # Prometheus metrics — local dev convenience only. Never publish
      # this port in production (see docs/turn.md's production checklist).
      - "${TURN_PROMETHEUS_PORT:-9641}:9641/tcp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - raven-network

  # ---------------------------------------------------------------------
  # api — the control plane (Phase 2). Manages auth, projects, api keys,
  # rooms, and RTC tokens. Never carries media itself — see
  # docs/control-plane.md.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raven-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4100}
      # Container-to-container addresses — deliberately NOT the host-facing
      # DATABASE_URL/REDIS_URL in .env (those use localhost + the
      # host-mapped ports for Prisma CLI / `pnpm start:dev` running
      # directly on the host). See docs/local-development.md.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      # Host-facing URL, on purpose: this value is returned to clients
      # (browsers, mobile apps) so THEY know where to connect — it must
      # never be the container-internal "livekit:7880" address.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      # Hardcoded to the Docker service name, like DATABASE_URL/REDIS_URL
      # above — deliberately NOT interpolated from .env's own
      # LIVEKIT_INTERNAL_URL, which instead defaults to a host-reachable
      # address for `pnpm start:dev`/e2e tests run directly on the host.
      # Used by the api process itself (RoomServiceClient, /health), which
      # runs inside this same Docker network. See docs/dashboard.md#health.
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      RTC_TOKEN_DEFAULT_TTL_SECONDS: ${RTC_TOKEN_DEFAULT_TTL_SECONDS:-600}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      SIGNALING_MAX_PARTICIPANTS_PER_ROOM: ${SIGNALING_MAX_PARTICIPANTS_PER_ROOM:-50}
      SIGNALING_MAX_MESSAGE_BYTES: ${SIGNALING_MAX_MESSAGE_BYTES:-16384}
      SIGNALING_MAX_MESSAGES_PER_WINDOW: ${SIGNALING_MAX_MESSAGES_PER_WINDOW:-100}
      SIGNALING_MESSAGE_WINDOW_SECONDS: ${SIGNALING_MESSAGE_WINDOW_SECONDS:-10}
      SIGNALING_MAX_CONNECTIONS_PER_WINDOW: ${SIGNALING_MAX_CONNECTIONS_PER_WINDOW:-20}
      # Host-facing, on purpose — returned to real clients for ICE
      # servers, same reasoning as LIVEKIT_URL above.
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      # Hardcoded to the Docker service name, like LIVEKIT_INTERNAL_URL
      # above — used only by the api process's own /health STUN check.
      TURN_INTERNAL_HOST: coturn
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
    ports:
      - "${API_PORT:-4100}:${API_PORT:-4100}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${API_PORT:-4100}/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - raven-network
