name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # `prisma generate` reads prisma.config.ts, which resolves this eagerly —
  # so it has to be set even though generating a client never opens a
  # connection. A deliberately unreachable value: if a step ever does try
  # to reach a database with it, we want a loud connection error rather
  # than a silent write to something real.
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:1/raven_generate_only"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # Two commands, one config each: the root flat config covers apps/api
      # and every package, while apps/dashboard keeps eslint-config-next and
      # so is reached recursively.
      - run: pnpm run lint
      - run: pnpm -r --if-present run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # @raven/react, @raven/react-native and the CLI resolve their sibling
      # packages through dist/, which a fresh checkout does not have. Without
      # this the failures look like missing dependencies ("Cannot find module
      # '@raven/rtc'") rather than what they are: build ordering. Libraries
      # only — apps/api and the dashboard are built by the Build job.
      - run: pnpm --filter "./packages/*" run build
      - run: pnpm -r --if-present run typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # @raven/react, @raven/react-native and the CLI resolve their sibling
      # packages through dist/, which a fresh checkout does not have. Without
      # this the failures look like missing dependencies ("Cannot find module
      # '@raven/rtc'") rather than what they are: build ordering. Libraries
      # only — apps/api and the dashboard are built by the Build job.
      - run: pnpm --filter "./packages/*" run build
      - run: pnpm -r --if-present run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      - run: pnpm -r --if-present run build
