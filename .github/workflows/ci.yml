name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Pinned so a runner-image update cannot change what the Dart formatter
  # and analyzer consider correct — a format check is only meaningful
  # against a fixed tool version. (Python is pinned by the matrix below.)
  FLUTTER_VERSION: "3.47.2"
  # `prisma generate` reads prisma.config.ts, which resolves this eagerly —
  # so it has to be set even though generating a client never opens a
  # connection. A deliberately unreachable value: if a step ever does try
  # to reach a database with it, we want a loud connection error rather
  # than a silent write to something real.
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:1/raven_generate_only"

jobs:
  # Cheap and fails fast, so a whitespace-only mistake does not burn a full
  # matrix. Go and Dart formatting are checked by the jobs that own those
  # languages (sfu-publish.yml and `flutter` below).
  #
  # KNOWN RED until the one-time adoption pass lands. Prettier was added
  # without reformatting the existing tree — ~345 files predate it. Fix
  # with a single `pnpm format` commit, then record its SHA in
  # .git-blame-ignore-revs. See docs/development.md#formatting.
  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          if ! pnpm run format:check; then
            echo "::error::Formatting check failed. Run: pnpm format"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # Two commands, one config each: the root flat config covers apps/api
      # and every package, while apps/dashboard keeps eslint-config-next and
      # so is reached recursively.
      - run: pnpm run lint
      - run: pnpm -r --if-present run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # @raven/react, @raven/react-native and the CLI resolve their sibling
      # packages through dist/, which a fresh checkout does not have. Without
      # this the failures look like missing dependencies ("Cannot find module
      # '@raven/rtc'") rather than what they are: build ordering. Libraries
      # only — apps/api and the dashboard are built by the Build job.
      - run: pnpm --filter "./packages/*" run build
      - run: pnpm -r --if-present run typecheck

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify-docs checks documented SDK imports against each package's built
      # .d.ts, which is what a consumer's editor resolves. Without the build it
      # would fall back to the barrel source and check a weaker claim.
      - run: pnpm --filter "./packages/*" run build
      - name: Compare the docs against the code they describe
        run: |
          node scripts/docs-groundtruth.mjs
          node scripts/generate-api-reference.mjs
          node scripts/verify-docs.mjs
      # A regenerated reference that differs from what is committed means the
      # controllers moved and the docs did not. Surfaced as a diff rather than
      # as a silent overwrite, so the change lands in a reviewable commit.
      - name: Fail if the generated API reference is stale
        run: git diff --exit-code -- apps/docs/content/api/

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      # @raven/react, @raven/react-native and the CLI resolve their sibling
      # packages through dist/, which a fresh checkout does not have. Without
      # this the failures look like missing dependencies ("Cannot find module
      # '@raven/rtc'") rather than what they are: build ordering. Libraries
      # only — apps/api and the dashboard are built by the Build job.
      - run: pnpm --filter "./packages/*" run build
      - run: pnpm -r --if-present run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raven/api run prisma:generate
      - run: pnpm -r --if-present run build

  # ---------------------------------------------------------------------------
  # Python server SDK (sdks/python).
  #
  # Not a pnpm workspace member, so it needs its own job. The matrix is the
  # range pyproject.toml claims to support (requires-python = ">=3.10"): a
  # claim nothing tests is a claim, not a fact.
  # ---------------------------------------------------------------------------
  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Formatter and linter are both ruff, configured in pyproject.toml.
      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      # mypy is already configured `strict = true`; this is what enforces it.
      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q

      # Only once — a wheel is pure Python and identical across the matrix,
      # and `twine check` is what catches a README that will not render on
      # PyPI.
      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: sdks/python/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flutter/Dart SDKs (sdks/flutter/*).
  #
  # No emulator anywhere: every test in these three packages is pure Dart
  # over `flutter_test`, so they run headless on a standard runner. The
  # packages are Flutter packages rather than plain Dart ones (they depend
  # on the flutter SDK), which is why this uses `flutter test`.
  #
  # raven_live is built last on purpose — it composes the other two through
  # dependency_overrides pointing at this working tree.
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter SDK (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [raven_rtc, raven_chat, raven_live]
    defaults:
      run:
        working-directory: sdks/flutter/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # `dart format` is canonical and non-configurable beyond line length,
      # so this is the whole formatting story for Dart.
      - name: Format check
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::error::Dart formatting check failed. Run: dart format lib test"
            exit 1
          fi

      # --fatal-infos because analysis_options.yaml was tuned so that a
      # clean tree really is clean; anything it reports is worth reading.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      # Catches what only pub notices: missing LICENSE/README, bad metadata,
      # an unpublishable dependency. Never publishes — --dry-run is
      # read-only against pub.dev.
      #
      # Reported, not enforced, and that is deliberate rather than lazy:
      # `pub publish --dry-run` exits non-zero on *warnings*, and raven_live
      # has one that cannot be cleared until raven_rtc and raven_chat are
      # actually on pub.dev ("non-dev dependencies are overridden"). Gating
      # on it would mean a permanently red job that says nothing new.
      # Turn this into a hard gate once the first release is out.
      - name: Validate package for publishing (report only)
        continue-on-error: true
        run: flutter pub publish --dry-run
