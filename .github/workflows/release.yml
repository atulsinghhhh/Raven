name: Release

# Changesets-driven release for the eight public @ravenkash/* packages.
#
#   PR carrying a changeset
#      ↓ merged to main
#   this workflow opens/updates a "Version Packages" PR
#      ↓ you review and merge that PR
#   this workflow runs again, finds no changesets pending, and publishes
#      ↓
#   npm  →  git tags  →  GitHub Releases
#
# Nothing publishes on a normal merge. The version PR is the approval gate,
# and it is a human action.
#
# The four apps (@raven/api, @raven/dashboard, @raven/docs, @raven/www) are
# `private: true` and listed in .changeset/config.json's `ignore`. They are
# deployed, never published; changesets will not touch them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a release mid-publish: a half-published set of
  # interdependent packages is far worse than a queued run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # `prisma generate` loads apps/api/prisma.config.ts, which resolves this
  # eagerly and aborts with PrismaConfigEnvError when it is unset — even
  # though generating a client never opens a connection. That is what broke
  # every release run before this line existed: the workflow died at
  # "Generate Prisma client" and nothing was ever published.
  #
  # Deliberately unreachable rather than a real database. If a step ever
  # does try to connect with it, we want a loud connection error against
  # port 1 rather than a silent write to something real. ci.yml carries the
  # identical value for the identical reason — keep the two in step.
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:1/raven_generate_only"

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Skip the version PR's own merge commit only if it carried nothing —
    # changesets/action decides that itself, so no ref filtering here.
    permissions:
      # Push version-bump commits, create tags, create GitHub Releases.
      contents: write
      # Open and update the "Version Packages" PR.
      pull-requests: write
      # npm trusted publishing (OIDC). Harmless when NPM_TOKEN is used
      # instead; see the note on authentication below.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs history to work out what changed since the last
          # release and to write changelog links.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # Points npm at the public registry and wires up OIDC/token auth
          # for the publish step.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Publishing a broken tarball cannot be undone — npm unpublish is
      # heavily restricted. So the same gates that guard main run again
      # here, on the exact tree about to be packed.
      - name: Generate Prisma client
        run: pnpm --filter @raven/api run prisma:generate

      - name: Typecheck
        run: |
          pnpm --filter "./packages/*" run build
          pnpm -r --if-present run typecheck

      - name: Unit tests
        run: pnpm -r --if-present run test

      # Fails the release if any package about to be published is missing a
      # README, a LICENSE, repository metadata or publishConfig.access, or
      # if a private package has somehow become publishable.
      - name: Verify package metadata
        run: node scripts/verify-package-metadata.mjs

      # Every publishable package is packed with the real packer and the
      # manifest inside the tarball inspected, without contacting the
      # registry.
      #
      # This step used to run `npm publish --dry-run`, which lists the files
      # in the tarball but never validates dependency ranges — so it passed
      # happily on @ravenkash/rtc@0.1.0, whose published manifest still read
      # `"@ravenkash/effects": "workspace:*"` and failed for every installer
      # on earth with EUNSUPPORTEDPROTOCOL.
      - name: Verify packed manifests are installable
        run: node scripts/verify-pack-manifests.mjs

      - name: Changesets — version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Builds every package, then publishes only those whose version is
          # not already on the registry, in dependency order.
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          # One GitHub Release per published package, tagged
          # <package>@<version>, with that package's changelog entry as the
          # body. Written by changesets from the real changeset files — no
          # release is ever invented.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---------------------------------------------------------------
          # Authentication.
          #
          # Preferred: npm **trusted publishing** — configure each package on
          # npmjs.com to trust this repository and workflow, and the OIDC
          # token from `id-token: write` above is exchanged for a short-lived
          # credential. Nothing long-lived is stored in GitHub.
          #
          # NPM_TOKEN below is the fallback for packages not yet migrated to
          # trusted publishing. It is read from repository secrets and never
          # echoed; if it is unset the publish step fails loudly rather than
          # publishing anonymously.
          #
          # See docs/releases.md for the one-time setup.
          # ---------------------------------------------------------------
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Release run"
            echo
            if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
              echo "Published:"
              echo '```json'
              echo '${{ steps.changesets.outputs.publishedPackages }}'
              echo '```'
            elif [ -n "${{ steps.changesets.outputs.pullRequestNumber }}" ]; then
              echo "Version PR: #${{ steps.changesets.outputs.pullRequestNumber }} — review and merge it to publish."
            else
              echo "No changesets pending. Nothing to version, nothing to publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
