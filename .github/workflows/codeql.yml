name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — so we catch newly disclosed advisories even
    # when there's no code churn to trigger a push/pull_request.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    # CodeQL writes its results to code scanning, which needs GitHub Advanced
    # Security. Private repositories do not have it, and requesting the
    # `security-events` scope without it yields a token that cannot read the
    # repository at all — every run so far has failed at checkout with
    # "Repository not found", not at analysis.
    #
    # Skipping is honest; a job that can never pass trains people to ignore a
    # red X. This starts running by itself the moment the repo goes public or
    # Advanced Security is enabled.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
