name: E2E

# Boots the real infra stack (Redis, the Livqeno SFU, coturn — see
# docker-compose.yml), runs the SFU's own Go tests against real Pion
# peers, then runs apps/api's e2e suite against the stack, same as a
# developer would locally.
#
# The API e2e also builds and spawns a *second* SFU of its own, on
# non-conflicting ports, so `room.join` negotiates against a real node.
# That is why Go is set up below even though nothing here is a Go service.
# See docs/rtc/test-matrix.md for what each layer proves.
#
# The one deliberate difference from a developer's setup: the database is a
# throwaway Postgres service container, not the Supabase database Livqeno
# actually runs on (docs/deployment/managed-postgres.md). The e2e suite
# applies migrations and writes freely, and two concurrent CI runs would
# corrupt each other's fixtures — neither is acceptable against a shared
# hosted database. CI is the only place a local Postgres remains, and it is
# a test fixture rather than Livqeno's database.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # 1.26.4 is affected by GO-2026-5856 (crypto/tls) and GO-2026-5026
  # (net/http), both of which govulncheck reports as reachable from this
  # service. Keep in step with sfu-publish.yml and security.yml.
  GO_VERSION: "1.26.6"
  # Kept in step with ci.yml's `flutter` job — a version drift here would
  # let this workflow build a `live_host` web bundle the format/analyze/test
  # job never actually validated.
  FLUTTER_VERSION: "3.47.2"

jobs:
  e2e:
    name: API e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raven
          POSTGRES_USER: raven
          POSTGRES_PASSWORD: raven
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The signaling e2e builds services/sfu and runs it as a child
      # process, so it can negotiate against a real Pion node rather than
      # a stub. Pinned rather than relying on whatever the runner image
      # ships, so a runner update cannot silently change the media plane
      # under the tests.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/sfu/go.sum

      # flutter-live-streaming.e2e-spec.ts drives a real `flutter build web`
      # release build of flutter_check/live_host as the Flutter host, next
      # to a real Chromium viewer — same "nothing mocked" posture as the
      # effects suites. The suite refuses to run without this build rather
      # than skipping silently, so it has to exist before test:e2e below.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: pnpm install --frozen-lockfile

      # Must come before prisma:generate: prisma.config.ts resolves
      # DATABASE_URL from the root .env, so generating a client without one
      # fails outright.
      #
      # The database URLs are rewritten in the file rather than injected as
      # step-level `env:`, so that every consumer — the Prisma CLI, and the
      # API booted in-process by the e2e suite — reads one consistent value
      # from one place. .env.example ships Supabase placeholders, which
      # would not resolve here and must not be reached from CI anyway.
      - name: Prepare infra env
        run: |
          cp .env.example .env
          CI_DB="postgresql://raven:raven@localhost:5432/raven"
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${CI_DB}|" .env
          sed -i "s|^DIRECT_URL=.*|DIRECT_URL=${CI_DB}|" .env
          bash scripts/generate-turn-cert.sh

      - run: pnpm --filter @raven/api run prisma:generate

      # live-streams-media.e2e-spec.ts stages scripts/capacity/harness's
      # vendor/ SDK from these dist/ folders with `rebuild: false` (see
      # build-harness-sdk.mjs) — it deliberately does not build them
      # itself, so they have to exist by the time that suite's beforeAll
      # runs, same as apps/api and the dashboard need this before the
      # Build job in ci.yml.
      - run: pnpm --filter "./packages/*" run build

      # The effects suites drive two real Chromium contexts against the
      # SFU — the only tests anywhere in this repo where browser WebRTC
      # talks to Livqeno's media plane. Worth the download: they are what
      # caught the msid mismatch that every fake-transport test agreed was
      # fine. See docs/rtc/test-matrix.md.
      - name: Install Chromium for Playwright
        run: pnpm --filter @raven/api exec playwright install --with-deps chromium

      # Path deps only (raven_live/raven_rtc/raven_chat resolve to this
      # working tree, see flutter_check/live_host/pubspec.yaml), so this
      # needs nothing beyond the Flutter SDK set up above.
      - name: Build Flutter web host for the live-streaming e2e suite
        working-directory: flutter_check/live_host
        run: |
          flutter pub get
          flutter build web --release

      # The *-pubdev e2e suites (flutter-chat-pubdev, flutter-live-streaming-pubdev,
      # flutter-rtc-datachannel-pubdev, flutter-rtc-multiparty-pubdev,
      # flutter-combined-pubdev) each drive their own real `flutter build web`
      # release build of flutter_check/published_consumer — the one Flutter Web
      # app that resolves raven_chat/raven_rtc/raven_live from pub.dev rather
      # than a local path, see its pubspec.yaml. Same "refuses to run without
      # this build" posture as the live_host suite above, so every target has
      # to exist before test:e2e below.
      - name: Build Flutter web pub.dev consumer targets for the *-pubdev e2e suites
        working-directory: flutter_check/published_consumer
        run: |
          flutter pub get
          flutter build web --release -t lib/main_chat.dart -o build/web_chat
          flutter build web --release -t lib/main_live_host.dart -o build/web_live_host
          flutter build web --release -t lib/main_data.dart -o build/web_data
          flutter build web --release -t lib/main_video.dart -o build/web_video
          flutter build web --release -t lib/main_combined.dart -o build/web_combined

      # --no-deps is load-bearing. `sfu` depends_on `api`, which depends_on
      # `migrate` completing, so without it compose also starts the
      # containerised API and migration job. Neither belongs in CI: the e2e
      # suite boots its own API in-process and applies migrations itself in
      # the step below. Worse, neither can work here — those containers read
      # DATABASE_URL from .env, which CI points at localhost:5432, and inside
      # a container that is the container's own loopback rather than the
      # runner host where the Postgres service container is published.
      # `migrate` exits 1 with P1001 and takes the whole step down with it.
      #
      # The SFU is fine unlinked: it retries registration against api:4100 and
      # logs warnings, but /healthz is liveness-only so --wait is satisfied,
      # and the suite registers this node into its own scratch database via
      # registerLocalSfu() instead of relying on the node's self-registration.
      # See apps/api/test/helpers/register-local-sfu.ts.
      - name: Start infra (redis, sfu, coturn)
        run: docker compose up -d --wait --no-deps redis sfu coturn

      # Applies prisma/migrations to the service container above, over
      # DIRECT_URL — which CI points at the same database as DATABASE_URL,
      # there being no pooler in front of it.
      - name: Apply database migrations
        run: pnpm --filter @raven/api run prisma:migrate:deploy

      # The SFU's own tests: real Pion peers, real ICE/DTLS/SRTP, real
      # RTP. These are what actually prove media forwarding, simulcast and
      # RTCP recovery — the API e2e below cannot, since `ws` is not a
      # WebRTC endpoint. Run first because they are fast and a failure
      # here makes the e2e result uninterpretable.
      - name: Run SFU tests
        run: go test -race ./...
        working-directory: services/sfu

      # Forced-TURN-relay path (spec §41, turn_relay_test.go): gated behind
      # the `turnrelay` build tag because it needs a real, reachable coturn
      # with a known shared secret — which plain `go test ./...` above has
      # no way to hand it. The infra step already started coturn with
      # --allow-loopback-peers for exactly this. Without this step the file
      # is invisible to CI and only runs when someone remembers to run it
      # by hand — which is how the Brave/relay-only interop gap (external
      # developer report #7) went unverified in the first place.
      #
      # TURN_HOST is overridden to localhost: the container hostname `coturn`
      # (this test's own fallback default) only resolves on the Docker
      # network, not from the runner host where this test process runs.
      - name: Run TURN relay tests (forced-relay path)
        run: |
          set -a
          source ../../.env
          set +a
          TURN_HOST=localhost go test -tags turnrelay -v ./internal/room/
        working-directory: services/sfu

      - name: Run e2e tests
        run: pnpm --filter @raven/api run test:e2e

      - name: Dump infra logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down infra
        if: always()
        run: docker compose down -v
