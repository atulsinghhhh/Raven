# Raven local dev LiveKit config.
#
# API keys, Redis connection, and the advertised node IP aren't set here —
# they come in as CLI flags from docker-compose.yml so they can be pulled
# from .env instead of hardcoded in a committed file. Why LiveKit in the
# first place: docs/architecture/sfu-comparison.md and infrastructure-decisions.md.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50019
  # No cloud load balancer locally, so just advertise the node IP passed
  # via --node-ip instead of trying to auto-detect one.
  use_external_ip: false

# Keep logs readable while iterating locally.
log_level: info

# No TURN config here — Raven runs its own separate coturn deployment
# instead of LiveKit's built-in relay, so TURN credential issuance stays
# owned by our Token Service rather than LiveKit. See docs/architecture/turn.md.
