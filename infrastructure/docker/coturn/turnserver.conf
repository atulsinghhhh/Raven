# Raven — local development coturn configuration.
#
# The shared secret (--static-auth-secret) is intentionally NOT set here —
# it is passed as a CLI flag in docker-compose.yml, sourced from .env, so
# it never lives in a committed file. CLI flags override config file
# values in coturn, so this file only carries non-secret structural config.
#
# See docs/architecture/turn.md for the full rationale.

# Signaling port for TURN/STUN control messages (allocate/refresh/etc).
listening-port=3478

# Relay port range: TURN allocates a port here per active relayed session.
# Must match the range published/mapped in docker-compose.yml.
min-port=49160
max-port=49200

# Time-limited credentials derived from a shared secret (coturn's
# "REST API" auth mechanism), not static long-lived username/password
# pairs. Minted per RTC token by the control plane (Phase 4) — see
# turn-credential.util.ts and docs/turn.md#authentication.
#
# lt-cred-mech (coturn's separate static-user-database long-term-credential
# mechanism) is deliberately NOT set alongside use-auth-secret — coturn
# logs a startup warning if both are present ("could not mix... shared
# secret overrides"), since they're two different auth backends. Caught
# by inspecting the actual startup logs, not assumed.
use-auth-secret
realm=raven.local

# TURNS (TLS) / DTLS listener. Uses a self-signed cert generated by
# scripts/generate-turn-cert.sh for LOCAL DEV ONLY — browsers reject
# self-signed certs for TURNS by default, so this proves the server-side
# TLS configuration works (verifiable with openssl s_client /
# turnutils_uclient -S) without claiming a real end-to-end browser test.
# Production needs a real CA-issued cert for the public TURN hostname —
# see docs/turn.md#tls.
#
# No explicit minimum-TLS-version directive is set: coturn 4.17.2 has no
# "no-tlsv1"/"no-tlsv1_1" config directive (an earlier version of this
# file carried those two lines — they are silently ignored as "Bad
# configuration format" and were verified to do nothing, so removed).
# Its actual minimum defaults to TLS 1.2 already; --tlsv1/--tlsv1_1 exist
# only to *lower* that floor, and are never passed here.
tls-listening-port=5349
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/key.pem

# Per-allocation/global quotas, bandwidth cap, and Prometheus metrics are
# passed as CLI flags in docker-compose.yml instead of here — this file
# is read literally by coturn (no shell-style ${VAR} expansion), so any
# value that needs to come from .env has to be a CLI flag, the same
# reason the auth secret is a CLI flag rather than a line in this file.
# See docs/turn.md#abuse-protection and #turn-usage-metrics.

# Reduce local log noise while keeping useful startup diagnostics.
simple-log
log-file=stdout

# Local dev safety: do not allow this relay to be used to reach other
# hosts on the loopback/private ranges outside our own Docker network.
no-multicast-peers
