# Livqeno local dev coturn config.
#
# The shared secret (--static-auth-secret) isn't set here — it's passed as
# a CLI flag in docker-compose.yml, sourced from .env, so it never ends up
# in a committed file. CLI flags win over config file values in coturn, so
# this file only holds the non-secret structural bits.
#
# Full rationale in docs/architecture/turn.md.

# Signaling port for TURN/STUN control messages (allocate/refresh/etc).
listening-port=3478

# Relay port range: TURN allocates a port here per active relayed session.
# Must match the range published/mapped in docker-compose.yml.
min-port=49160
max-port=49200

# Time-limited credentials derived from a shared secret (coturn's "REST
# API" auth mechanism) rather than static long-lived username/password
# pairs — minted per RTC token by the control plane. See
# turn-credential.util.ts and docs/turn.md#authentication.
#
# Not setting lt-cred-mech (coturn's separate static-user-database
# long-term-credential mechanism) alongside this — coturn actually warns
# on startup if both are present ("could not mix... shared secret
# overrides"), since they're two different auth backends. Confirmed by
# checking the startup logs, not just guessing.
use-auth-secret
realm=raven.local

# TURNS (TLS)/DTLS listener, using the self-signed cert from
# scripts/generate-turn-cert.sh — local dev only. Browsers reject
# self-signed certs for TURNS by default, so this just proves the
# server-side TLS setup works (check with openssl s_client /
# turnutils_uclient -S), not a real end-to-end browser test. Production
# needs a real CA-issued cert for the public TURN hostname, see docs/turn.md#tls.
#
# No minimum-TLS-version directive here — coturn 4.17.2 doesn't have a
# "no-tlsv1"/"no-tlsv1_1" directive. An earlier version of this file had
# those two lines; they were silently ignored ("Bad configuration format")
# and did nothing, so they got removed. The actual default floor is
# already TLS 1.2; --tlsv1/--tlsv1_1 only exist to lower it, and we don't pass them.
tls-listening-port=5349
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/key.pem

# Quotas, bandwidth cap, and Prometheus metrics all live as CLI flags in
# docker-compose.yml instead of here — coturn reads this file literally,
# no ${VAR} expansion, so anything coming from .env has to be a flag.
# Same reason the auth secret isn't a line in this file either.

# Cuts down local log noise but keeps the useful startup diagnostics.
simple-log
log-file=stdout

# Don't let this relay be used to reach other hosts on the loopback/private
# ranges outside our Docker network.
no-multicast-peers
