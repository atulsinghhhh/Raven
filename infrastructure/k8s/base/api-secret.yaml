# PLACEHOLDER VALUES — do not deploy this file as-is.
#
# A plain Secret manifest checked into git is not secrets management —
# it's a ConfigMap with worse ergonomics, since anyone with repo access
# can read these in cleartext (and `kubectl get secret -o yaml` decodes
# base64 trivially). This file exists to document the *shape* of what
# apps/api needs (every key below is read directly from process.env —
# see shared/config/configuration.ts) so an overlay can generate the
# real thing.
#
# Production path (P1 — not built this pass, needs a secrets backend
# this session doesn't have): replace this file with an ExternalSecret
# (External Secrets Operator, pulling from Vault/AWS Secrets
# Manager/GCP Secret Manager) or a SealedSecret, keyed off the same
# field names below.
apiVersion: v1
kind: Secret
metadata:
  name: raven-api-secrets
  labels:
    app.kubernetes.io/name: raven-api
    app.kubernetes.io/part-of: raven
  annotations:
    raven.dev/warning: "placeholder values — see comments in this file; replace with an ExternalSecret/SealedSecret before real use"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/raven"
  REDIS_URL: "redis://:REPLACE_ME@REPLACE_ME:6379"
  JWT_SECRET: "REPLACE_ME_min_32_chars"
  API_KEY_HASH_SECRET: "REPLACE_ME_min_32_chars"
  CHAT_TOKEN_SECRET: "REPLACE_ME_min_32_chars"
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME_min_32_chars"
  TURN_SECRET: "REPLACE_ME_min_32_chars"
  STORAGE_ACCESS_KEY_ID: "REPLACE_ME"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE_ME"
